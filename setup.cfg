[tool:pytest]
testpaths = tests

[coverage:run]
# Excluir archivos que requieren SUMO/TraCI o modelos entrenados:
# - traci_runner.py, rl_env*.py, benchmark*.py: scripts de integración SUMO
# - dqn_controller.py: requiere modelo .pt entrenado + SUMO en tiempo de ejecución
omit =
    */simulation/traci_runner.py
    */simulation/rl_env.py
    */simulation/rl_env_2x2.py
    */evaluation/benchmark.py
    */evaluation/benchmark_2x2.py
    */decision/dqn_controller.py

[coverage:report]
exclude_lines =
    pragma: no cover
    if __name__ == .__main__.:
    def main\(\)
